<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-label="Dense cv::Mat GEMM Comparison">
  <rect width="760" height="320" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <style>
    .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #656d76; }
    .axis { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #656d76; }
    .label { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .legend { font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  </style>
  <text x="24" y="30" class="title">Dense cv::Mat GEMM: Custom NEON vs OpenCV cv::gemm vs Accelerate</text>
  <text x="24" y="48" class="subtitle">1024 × 1024 double-precision (CV_64F) — Apple M2 Pro (-O3, median of 5 runs)</text>
  <line x1="185.0" y1="68" x2="185.0" y2="272" stroke="#eaeef2" stroke-width="1"/>
  <text x="185.0" y="290" text-anchor="middle" class="axis">0</text>
  <line x1="311.2" y1="68" x2="311.2" y2="272" stroke="#eaeef2" stroke-width="1"/>
  <text x="311.2" y="290" text-anchor="middle" class="axis">100</text>
  <line x1="437.5" y1="68" x2="437.5" y2="272" stroke="#eaeef2" stroke-width="1"/>
  <text x="437.5" y="290" text-anchor="middle" class="axis">200</text>
  <line x1="563.8" y1="68" x2="563.8" y2="272" stroke="#eaeef2" stroke-width="1"/>
  <text x="563.8" y="290" text-anchor="middle" class="axis">300</text>
  <line x1="690.0" y1="68" x2="690.0" y2="272" stroke="#eaeef2" stroke-width="1"/>
  <text x="690.0" y="290" text-anchor="middle" class="axis">400</text>
  <text x="437.5" y="310" text-anchor="middle" class="axis">Throughput (GFLOP/s, higher is better)</text>
  <line x1="185" y1="68" x2="185" y2="272" stroke="#8c959f" stroke-width="1.2"/>
  <text x="173" y="106.0" text-anchor="end" class="legend">neon_4x4 (CV_64F)</text>
  <rect x="185" y="87.0" width="34.3" height="30" rx="4" fill="#1a7f37"/>
  <text x="227.3" y="106.0" class="label">27.2 GFLOP/s (79.3 ms)</text>
  <text x="173" y="174.0" text-anchor="end" class="legend">OpenCV cv::gemm</text>
  <rect x="185" y="155.0" width="452.9" height="30" rx="4" fill="#bf8700"/>
  <text x="645.9" y="174.0" class="label">358.7 GFLOP/s (9.42 ms)</text>
  <text x="173" y="242.0" text-anchor="end" class="legend">Apple Accelerate</text>
  <rect x="185" y="223.0" width="413.5" height="30" rx="4" fill="#0969da"/>
  <text x="606.5" y="242.0" class="label">327.5 GFLOP/s (6.58 ms)</text>
</svg>
