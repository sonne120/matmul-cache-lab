<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="2D Convolution Throughput">
  <rect width="760" height="340" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <style>
    .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #656d76; }
    .axis { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #656d76; }
    .label { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .legend { font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  </style>
  <text x="24" y="30" class="title">2D Convolution via im2col + GEMM vs OpenCV cv::filter2D</text>
  <text x="24" y="48" class="subtitle">512 × 512 image (CV_32F), 5 × 5 kernel, 32 filters — Apple M2 Pro (-O3, median of 5 runs)</text>
  <line x1="185.0" y1="68" x2="185.0" y2="292" stroke="#eaeef2" stroke-width="1"/>
  <text x="185.0" y="310" text-anchor="middle" class="axis">0</text>
  <line x1="297.2" y1="68" x2="297.2" y2="292" stroke="#eaeef2" stroke-width="1"/>
  <text x="297.2" y="310" text-anchor="middle" class="axis">10</text>
  <line x1="409.4" y1="68" x2="409.4" y2="292" stroke="#eaeef2" stroke-width="1"/>
  <text x="409.4" y="310" text-anchor="middle" class="axis">20</text>
  <line x1="521.7" y1="68" x2="521.7" y2="292" stroke="#eaeef2" stroke-width="1"/>
  <text x="521.7" y="310" text-anchor="middle" class="axis">30</text>
  <line x1="633.9" y1="68" x2="633.9" y2="292" stroke="#eaeef2" stroke-width="1"/>
  <text x="633.9" y="310" text-anchor="middle" class="axis">40</text>
  <text x="437.5" y="330" text-anchor="middle" class="axis">Throughput (GFLOP/s, higher is better)</text>
  <line x1="185" y1="68" x2="185" y2="292" stroke="#8c959f" stroke-width="1.2"/>
  <text x="173" y="100.0" text-anchor="end" class="legend">conv2d_naive (4-loop)</text>
  <rect x="185" y="82.0" width="29.2" height="28" rx="4" fill="#8b949e"/>
  <text x="222.2" y="100.0" class="label">2.6 GFLOP/s (162 ms)</text>
  <text x="173" y="156.0" text-anchor="end" class="legend">im2col + ikj_f32</text>
  <rect x="185" y="138.0" width="91.2" height="28" rx="4" fill="#0969da"/>
  <text x="284.2" y="156.0" class="label">8.1 GFLOP/s (51.7 ms)</text>
  <text x="173" y="212.0" text-anchor="end" class="legend">OpenCV cv::filter2D</text>
  <rect x="185" y="194.0" width="443.3" height="28" rx="4" fill="#bf8700"/>
  <text x="636.3" y="212.0" class="label">39.5 GFLOP/s (10.6 ms)</text>
  <text x="173" y="268.0" text-anchor="end" class="legend">im2col + NEON 4×4 f32</text>
  <rect x="185" y="250.0" width="456.7" height="28" rx="4" fill="#1a7f37"/>
  <text x="649.7" y="268.0" class="label">40.7 GFLOP/s (10.3 ms)</text>
</svg>
